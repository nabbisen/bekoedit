name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ELOC_LIMIT: 500

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release artifact verifier self-test
        shell: bash
        run: bash scripts/test-release-artifacts.sh "$RUNNER_TEMP"
      - name: RFC lifecycle invariants
        shell: bash
        run: bash scripts/check-rfcs.sh
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, peeled commit
      - name: Validate package MSRV metadata
        shell: bash
        run: |
          set -euo pipefail
          METADATA="$RUNNER_TEMP/bekoedit-metadata.json"
          cargo +1.88.0 metadata --locked --no-deps --format-version 1 > "$METADATA"
          python3 - "$METADATA" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          members = set(metadata["workspace_members"])
          actual = {
              package["name"]: package.get("rust_version")
              for package in metadata["packages"]
              if package["id"] in members
          }
          expected = {
              "bekoedit": "1.88",
              "bekoedit-core": "1.88",
              "bekoedit-fs": None,
              "bekoedit-markdown": "1.88",
              "bekoedit-ui-contract": None,
          }
          if actual != expected:
              raise SystemExit(f"workspace MSRV metadata mismatch: {actual!r}")
          print(f"workspace MSRV metadata: {actual!r}")
          PY
      - run: cargo +1.88.0 fmt --all -- --check
      - name: Install WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev
      - run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: git diff --exit-code -- Cargo.lock
      - name: ELOC compliance check
        shell: bash
        run: |
          OVER=""
          while IFS= read -r f; do
            n=$(grep -vc "^[[:space:]]*$\|^[[:space:]]*//" "$f" 2>/dev/null || echo 0)
            if [ "$n" -gt "$ELOC_LIMIT" ]; then
              OVER="${OVER}${n} ${f}"$'\n'
            fi
          done < <(find crates -name "*.rs" -type f)
          if [ -n "$OVER" ]; then
            echo "Files over ${ELOC_LIMIT} ELOC:"
            printf "%s" "$OVER"
            exit 1
          fi

  fs-msrv:
    name: Filesystem crate (Rust 1.85)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, peeled commit
        with:
          key: fs-msrv-1.85
      - name: Record exact compiler
        run: rustc +1.85.0 -vV
      - name: Validate filesystem package metadata
        shell: bash
        run: |
          set -euo pipefail
          METADATA="$RUNNER_TEMP/bekoedit-fs-metadata.json"
          cargo +1.85.0 metadata --locked --no-deps --format-version 1 > "$METADATA"
          python3 - "$METADATA" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          members = set(metadata["workspace_members"])
          matches = [
              package
              for package in metadata["packages"]
              if package["id"] in members and package["name"] == "bekoedit-fs"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one workspace bekoedit-fs package, got {len(matches)}")
          if matches[0].get("rust_version") is not None:
              raise SystemExit(
                  f"bekoedit-fs unexpectedly declares rust_version: {matches[0].get('rust_version')!r}"
              )
          print("bekoedit-fs has no new Cargo-enforced rust_version")
          PY
      - run: cargo +1.85.0 test -p bekoedit-fs --locked
      - run: git diff --exit-code -- Cargo.lock

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, peeled commit
      - run: cargo +1.88.0 metadata --locked --format-version 1
      - name: Record exact compiler
        run: rustc +1.88.0 -vV
      - name: Preflight macOS release inspection tool
        if: runner.os == 'macOS'
        shell: bash
        run: xcrun --find lipo
      - name: Preflight Windows release inspection tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Command llvm-readobj | Format-List Name,Source
      - run: cargo +1.88.0 test --locked # default-members only (headless, no GUI deps)
      - name: Build desktop application at MSRV
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo +1.88.0 build -p bekoedit --locked
      - name: Windows subsystem -- release is GUI, debug stays console (task 018)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-Subsystem([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "missing binary: $Path" }
            $headers = & llvm-readobj --file-headers $Path 2>&1
            if ($LASTEXITCODE -ne 0) { throw "llvm-readobj failed for ${Path}: $headers" }
            $line = $headers | Select-String -Pattern '^\s*Subsystem:' | Select-Object -First 1
            if (-not $line) { throw "no Subsystem field in the PE headers of $Path" }
            return $line.Line.Trim()
          }
          # Debug keeps the console, for development output.
          $debug = Get-Subsystem "target/debug/bekoedit.exe"
          Write-Output "debug   bekoedit.exe  $debug"
          if ($debug -notmatch 'IMAGE_SUBSYSTEM_WINDOWS_CUI') {
            throw "the debug build must stay a console (CUI) program; got: $debug"
          }
          # Release must be a GUI program: no console window beside the app.
          cargo +1.88.0 build -p bekoedit --release --locked
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }
          $release = Get-Subsystem "target/release/bekoedit.exe"
          Write-Output "release bekoedit.exe  $release"
          if ($release -notmatch 'IMAGE_SUBSYSTEM_WINDOWS_GUI') {
            throw "the release build must be a Windows GUI program (subsystem 2), not a console one; got: $release. Is main.rs's cfg_attr(not(debug_assertions), windows_subsystem = `"windows`") still in place?"
          }
          # Exit codes and redirected output survive the GUI subsystem.
          $stderr = Join-Path $env:RUNNER_TEMP "bekoedit-bad-argument.txt"
          $process = Start-Process -FilePath "target/release/bekoedit.exe" -ArgumentList "--webview-smoke" `
            -RedirectStandardError $stderr -NoNewWindow -Wait -PassThru
          $text = Get-Content -LiteralPath $stderr -Raw
          Write-Output "invalid argument: exit code $($process.ExitCode), redirected stderr: $text"
          if ($process.ExitCode -ne 2) { throw "expected exit code 2 for an invalid argument, got $($process.ExitCode)" }
          if ($text -notmatch '--webview-smoke requires exactly one profile-root argument') {
            throw "the redirected stderr did not carry the argument error"
          }
      - name: WebView2 runtime probe on this runner (task 020)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The real probe the launch uses, so a working install is never
          # wrongly blocked. Require that the test actually ran, not zero.
          $output = cargo +1.88.0 test -p bekoedit --locked real_webview2_probe_finds_the_runtime_on_this_machine -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) { throw "the real WebView2 probe test failed" }
          if (($output -join "`n") -notmatch 'test result: ok\. 1 passed') { throw "the real WebView2 probe test did not run" }
      - run: git diff --exit-code -- Cargo.lock

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, peeled commit
      - run: cargo +1.88.0 metadata --locked --format-version 1
      - run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - run: cargo +1.88.0 audit
      - run: git diff --exit-code -- Cargo.lock

  build-and-smoke:
    name: Build + smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, peeled commit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: cargo +1.88.0 metadata --locked --format-version 1
      - name: Preflight Linux release inspection tool
        run: |
          command -v readelf
          readelf --version
      - name: Install WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev xvfb xdotool
      - name: Install JS dependencies
        run: cd crates/bekoedit-app/js && npm ci
      - name: Test source-editor JavaScript adapter
        run: cd crates/bekoedit-app/js && npm test
      - name: Build JS bundle
        run: cd crates/bekoedit-app/js && node build.mjs
      - name: Check committed JS bundles are current
        run: git diff --exit-code -- crates/bekoedit-app/assets/editor-bundle.js crates/bekoedit-app/assets/focus-guard-bundle.js
      - name: Test desktop application
        run: cargo +1.88.0 test -p bekoedit --locked
      - name: Parse-check emitted eval scripts (RFC-042 slice 3 C1)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(target/eval-scripts/*.js)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no emitted eval scripts found under target/eval-scripts/ — did the Rust test that writes them run?"
            exit 1
          fi
          for f in "${scripts[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Build desktop app
        run: cargo +1.88.0 build -p bekoedit --release --locked
      - run: git diff --exit-code -- Cargo.lock
      - name: Smoke test (headless launch, exit 0 within 10 s)
        run: |
          # Verify the binary starts and exits cleanly in a headless display.
          # Uses xvfb-run to provide a virtual framebuffer on CI.
          timeout 10 xvfb-run -a ./target/release/bekoedit --headless-smoke
      - name: WebView lifecycle regression (RFC-041)
        run: |
          SMOKE_PARENT="$(mktemp -d "$RUNNER_TEMP/bekoedit-webview-smoke.XXXXXX")"
          trap 'rm -rf "$SMOKE_PARENT"' EXIT
          timeout 60 xvfb-run -a -s "-screen 0 1280x1024x24" \
            env NO_AT_BRIDGE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            ./target/release/bekoedit \
            --webview-smoke "$SMOKE_PARENT/bekoedit-webview-smoke-profile"
      - name: RFC-044 shell-behaviour run (§8 A-F)
        # BLOCKING since 2026-09-22. RFC-044 §10's promotion criterion --
        # ten consecutive green runs of this step on `main`, decided at §14
        # Q1 -- was met and is recorded in RFC-044's Status. The ten, each
        # read from its outcome line and never from a conclusion:
        # 35168677703 (25253cf), 35169930195 (b963bf3), 35171045314 (73b64d1),
        # 35658660098 (5d44a5b), 35659415492 (3264f3a), 35661767800 (06c5bbb),
        # 35663401077 (8989f1d), 35667042748 (0957415), 35679554952 (4476f90)
        # and 35680223116 (986d98f).
        # Not counted: 35663232933 (5888d49), whose log no longer returns any
        # RFC-044 line; an unreadable run is skipped, per the 2026-09-05
        # clock's precedent with run 33974083411. The clock's full history is
        # in this file's git log.
        #
        # ADDING A PHASE NOW (RFC-044 §10, amended 2026-09-22): the restart
        # rule was written for the non-blocking period and no longer applies
        # by itself. A change to this step's phase set merges blocking, with
        # its own mutation evidence, and the reviewer may instead require it
        # to land behind `continue-on-error` for a stated soak. If a phase
        # proves unstable on `main`, fix or remove the phase -- do not make
        # the whole step non-blocking again.
        #
        # This step's log carries the PASSED/FAILED line and the reason. The
        # next step still prints a greppable
        # `RFC-044 shell-behaviour outcome: <outcome>` line; now that the mask
        # is gone, this step's own conclusion is truthful too.
        id: shell_behaviour
        run: |
          BEHAVIOUR_PARENT="$(mktemp -d "$RUNNER_TEMP/bekoedit-shell-behaviour.XXXXXX")"
          trap 'rm -rf "$BEHAVIOUR_PARENT"' EXIT
          timeout 60 xvfb-run -a -s "-screen 0 1280x1024x24" \
            env NO_AT_BRIDGE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            ./target/release/bekoedit \
            --webview-shell-behaviour "$BEHAVIOUR_PARENT/bekoedit-webview-smoke-profile"
      - name: RFC-044 shell-behaviour outcome (unmasked)
        if: always()
        env:
          OUTCOME: ${{ steps.shell_behaviour.outcome }}
        run: |
          echo "RFC-044 shell-behaviour outcome: ${OUTCOME}"
          if [ "${OUTCOME}" != "success" ]; then
            echo "::warning title=RFC-044 shell-behaviour run did not pass::outcome=${OUTCOME}; see that step's log"
          fi
      - name: Task 023 trusted-click coverage (manual-walkthrough §B/§C)
        # NON-BLOCKING (task 023 §4, RFC-044 §10 as amended 2026-09-22): a
        # new run, not a new phase on an already-blocking step, so §4's
        # continue-on-error requirement applies to this step alone and
        # never touches the shell-behaviour step above.
        #
        # This is the first run in the project to send real X-level
        # (XTEST) input via `xdotool` rather than app-intercepted
        # synthetic events -- proven necessary in the review request
        # (§5.1: a synthetic click gets no default browser focus action,
        # so it cannot exercise §B/§C at all). That means real-desktop
        # concerns this project has not had to soak for before: whether
        # Xvfb's default pointer-focus behaviour (no window manager is
        # running) reliably delivers a click's default focus action to
        # WebKitGTK on every runner, and whether `xdotool`'s own timing
        # (`--sync`) is enough under CI's variable load.
        #
        # §C's own phase (mode_tab_focus) spent sixteen real CI runs never
        # completing before its cause was found (2026-09-23 no-op-terminal
        # review): TrustedClickPhase::as_str()'s terminal arm was sending
        # a result-stage name, not a phase name, so the driver rejected
        # every request for it before its own try/catch, silently. Fixed
        # structurally in phase.rs, with a bijection test
        # (every_as_str_is_a_phase_the_driver_knows) against the driver's
        # own source so this cannot come back quietly.
        #
        # Soak: 10 consecutive green runs of this step on `main`, read
        # from its own outcome line below (never from this step's masked
        # conclusion) -- the same N RFC-044 §10 itself used to promote its
        # shell-behaviour step to blocking, per the 2026-09-23 review §3.
        # That precedent is the justification for reusing it here rather
        # than picking a new number: ten runs is what this project has
        # already treated as enough evidence that a WebView-driven CI
        # mechanism, once green, stays green. Promotion to blocking is a
        # separate, later review decision -- this comment only starts the
        # clock.
        #
        # Known, unexplained flake (2026-09-23 review §2): run 35810114012
        # timed out at tree_row_focus after 97 retries (a real 10 s
        # internal deadline, not the as_str() bug above -- tree_row_focus
        # is never the terminal phase, so its own name was never wrong); a
        # rerun of the identical commit passed cleanly. Not root-caused,
        # has not recurred since. Read the soak against this, not in
        # ignorance of it.
        # Soak record (append here, do not replace):
        # 1/10 green -- 35847306100 (2026-09-23), the merge push itself
        # (task 023, 56b2f46).
        id: trusted_click
        continue-on-error: true
        run: |
          TRUSTED_CLICK_PARENT="$(mktemp -d "$RUNNER_TEMP/bekoedit-trusted-click.XXXXXX")"
          trap 'rm -rf "$TRUSTED_CLICK_PARENT"' EXIT
          timeout 60 xvfb-run -a -s "-screen 0 1280x1024x24" \
            env NO_AT_BRIDGE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            ./target/release/bekoedit \
            --webview-trusted-click "$TRUSTED_CLICK_PARENT/bekoedit-webview-smoke-profile"
      - name: Task 023 trusted-click outcome (unmasked)
        if: always()
        env:
          OUTCOME: ${{ steps.trusted_click.outcome }}
        run: |
          echo "Task 023 trusted-click outcome: ${OUTCOME}"
          if [ "${OUTCOME}" != "success" ]; then
            echo "::warning title=Task 023 trusted-click run did not pass::outcome=${OUTCOME}; see that step's log"
          fi
      - name: Check binary links and size
        run: |
          file target/release/bekoedit
          du -sh target/release/bekoedit
      - name: Cross-distribution portability check (RFC-045 slice 2)
        run: bash scripts/check-linux-portability-containers.sh target/release/bekoedit

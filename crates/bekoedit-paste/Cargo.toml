[package]
name        = "bekoedit-paste"
description = "Clipboard HTML to Markdown for bekoedit's paste path: a pure converter with size, panic and time guards (RFC-046)."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
# Exactly this, and nothing else (RFC-046 §5.3, §6.2). An exact pin, not a caret:
# two consecutive patch releases of mdka changed our output. A bump is a
# deliberate change, re-run against the fixture corpus. 3.0.0 (task 037) moved two
# outputs from 2.5.1, both fixes: `<sup>`/`<sub>` keep their meaning (2.6.0), and
# emphasis that opens a bold element is kept (2.7.0). 3.2.0 (task 038) is
# byte-identical to 3.0.0 except ordinals (fixture 30; upstream flattened
# `1<sup>st</sup>` to `1st` at our suggestion), with the mode and options
# unchanged -- `emphasis_from_style` (3.1.0) is a separate, deliberate opt-in.
mdka                        = { version = "=3.2.0", default-features = false }
thiserror                   = { workspace = true }

[dev-dependencies]
# For the structural raw-HTML test only (RFC-046 §5.3). Never shipped.
pulldown-cmark              = { workspace = true }

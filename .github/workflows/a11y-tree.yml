name: Accessibility tree

# RFC-050 slice 1, level 3: what a screen reader is given by the real WebKit
# page, read through AT-SPI by scripts/a11y-observer.py, with one file edited and
# saved through accessibility actions alone and its bytes asserted on disk by
# the app. Run by hand (workflow_dispatch) until its first runs are read; the
# push trigger is slice 1's step B, a follow-up request. Level 2, the headless
# markup checks, runs on every CI run in `cargo test`.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  a11y-tree:
    name: AT-SPI tree check (Linux, Xvfb, X11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, peeled commit
      - run: cargo +1.88.0 metadata --locked --format-version 1
      - name: Install WebView deps and the accessibility tooling
        # xvfb: the display. dbus-daemon and dbus-bin: dbus-run-session and
        # dbus-send, the private session bus. at-spi2-core: the accessibility
        # bus launcher. python3-gi and gir1.2-atspi-2.0: the observer's
        # bindings. The names were checked in an ubuntu:24.04 container.
        run: |
          bash scripts/install-linux-build-deps.sh \
            libssl-dev xvfb xauth dbus-daemon dbus-bin at-spi2-core \
            gir1.2-atspi-2.0 python3-gi
      - name: Observer unit tests (no display)
        run: |
          python3 scripts/test-a11y-observer.py
          python3 scripts/test-a11y-steps.py
      - name: Build desktop app
        run: cargo +1.88.0 build -p bekoedit --release --locked
      - name: Run the observer against the app
        run: bash scripts/a11y-tree-run.sh target/release/bekoedit "$RUNNER_TEMP/a11y-out"
      # The verdict and the bounded tree dump are kept whether the run passed or
      # not: a failure is read from them (docs/src/release-evidence.md).
      - name: Keep the verdict and the tree dump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-tree-verdict
          path: ${{ runner.temp }}/a11y-out/
          if-no-files-found: warn
